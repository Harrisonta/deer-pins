name: Refresh weather
on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/weather.py
      - name: Commit forecast
        run: |
          git config user.name "deer-pins-bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather
          git diff --cached --quiet || git commit -m "Weather $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
